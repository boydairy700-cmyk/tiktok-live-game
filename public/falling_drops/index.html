<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Falling Drops</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        canvas { display: block; }
        #status { position: absolute; top: 10px; left: 10px; color: #fff; font-family: sans-serif; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 10; }
    </style>
</head>
<body>
    <div id="status">Waiting for connection...</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let username = urlParams.get('user') || localStorage.getItem('tiktokUsername');
        const isTestMode = urlParams.get('test') === 'true';
        
        const socket = io();
        const statusEl = document.getElementById('status');

        if (isTestMode) {
            statusEl.innerText = '🟢 وضع التجربة 🧪';
            statusEl.style.color = '#0f0';
            setInterval(() => {
                const randomCoins = Math.floor(Math.random() * 50) + 1;
                const repeat = Math.floor(Math.random() * 3) + 1;
                const count = repeat;
                const multiplier = Math.min(1 + (randomCoins / 100), 5);
                for(let i=0; i<Math.min(count, 50); i++) {
                    setTimeout(() => spawnDrop('https://ui-avatars.com/api/?name=Test&background=random', multiplier), i * 100);
                }
            }, 3000);
            setInterval(() => {
                const likeCount = Math.floor(Math.random() * 10) + 1;
                for(let i=0; i<likeCount; i++) {
                    setTimeout(() => spawnDrop(null, 0.5), i * 50);
                }
            }, 1000);
        } else if (username) {
            socket.emit('connectTikTok', username);
            statusEl.innerText = 'Connecting to ' + username + '...';
        } else {
            statusEl.innerText = 'No username provided! Add ?user=YOUR_USERNAME to URL';
        }

        socket.on('tiktokConnected', () => { statusEl.innerText = 'Connected! Send gifts/likes to test.'; setTimeout(()=>statusEl.style.display='none', 5000); });
        socket.on('tiktokError', (e) => { statusEl.innerText = 'Error: ' + e; });
        socket.on('tiktokDisconnected', () => { statusEl.innerText = 'Disconnected'; });

        // Matter.js Setup
        const Engine = Matter.Engine, Render = Matter.Render, Runner = Matter.Runner,
              Bodies = Matter.Bodies, Composite = Matter.Composite;
        const engine = Engine.create();
        const render = Render.create({
            element: document.body, engine: engine,
            options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: 'transparent' }
        });
        
        // Ground
        const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight + 50, window.innerWidth, 100, { isStatic: true });
        const leftWall = Bodies.rectangle(-50, window.innerHeight/2, 100, window.innerHeight, { isStatic: true });
        const rightWall = Bodies.rectangle(window.innerWidth + 50, window.innerHeight/2, 100, window.innerHeight, { isStatic: true });
        Composite.add(engine.world, [ground, leftWall, rightWall]);
        
        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        function spawnDrop(imageUrl, sizeMultiplier = 1) {
            const size = 40 * sizeMultiplier;
            const x = Math.random() * (window.innerWidth - 100) + 50;
            const drop = Bodies.circle(x, -50, size/2, {
                restitution: 0.8,
                render: imageUrl ? { sprite: { texture: imageUrl, xScale: size/100, yScale: size/100 } } : { fillStyle: '#'+Math.floor(Math.random()*16777215).toString(16) }
            });
            Composite.add(engine.world, drop);

            // Remove after 20 seconds to prevent lag
            setTimeout(() => { Composite.remove(engine.world, drop); }, 20000);
        }

        socket.on('tiktokGift', (data) => {
            const count = data.repeatCount || 1;
            const multiplier = Math.min(1 + (data.diamondCount / 100), 5); // Max 5x size
            for(let i=0; i<Math.min(count, 50); i++) {
                setTimeout(() => spawnDrop(data.profilePictureUrl, multiplier), i * 100);
            }
        });

        socket.on('tiktokLike', (data) => {
            const count = Math.min(data.likeCount || 1, 15);
            for(let i=0; i<count; i++) {
                setTimeout(() => spawnDrop(null, 0.5), i * 50);
            }
        });

        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth; render.canvas.height = window.innerHeight;
            Matter.Body.setPosition(ground, { x: window.innerWidth/2, y: window.innerHeight + 50 });
            Matter.Body.setPosition(rightWall, { x: window.innerWidth + 50, y: window.innerHeight/2 });
        });
    </script>
</body>
</html>
