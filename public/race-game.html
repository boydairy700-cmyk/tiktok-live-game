<!-- Language Switcher -->
<style>
  .lang-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 9999;
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    box-shadow: 0 4px 15px rgba(0,242,254,0.4);
    transition: transform 0.2s;
  }
  .lang-btn:hover { transform: scale(1.05); }
  .lang-ar { display: inline; }
  .lang-en { display: none; }
  body.en-mode .lang-ar { display: none; }
  body.en-mode .lang-en { display: inline; }
</style>
<button class="lang-btn" onclick="toggleLang()" id="langToggleBtn">English</button>
<script>
  function applyLangToTextNodes(node) {
    if (node.nodeType === 3) {
      const text = node.nodeValue;
      if (text.includes(' | ')) {
        const parts = text.split(' | ');
        if (parts.length === 2) {
          const span = document.createElement('span');
          span.innerHTML = '<span class="lang-en">' + parts[0] + '</span><span class="lang-ar">' + parts[1] + '</span>';
          node.parentNode.replaceChild(span, node);
        }
      }
    } else if (node.nodeType === 1 && node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
      for (let i = 0; i < node.childNodes.length; i++) {
        applyLangToTextNodes(node.childNodes[i]);
      }
    }
  }

  // Initial apply
  document.addEventListener("DOMContentLoaded", () => {
    applyLangToTextNodes(document.body);
    
    // Also handle input placeholders
    const inputs = document.querySelectorAll('input, textarea');
    inputs.forEach(input => {
        if(input.placeholder && input.placeholder.includes(' | ')) {
            const parts = input.placeholder.split(' | ');
            input.setAttribute('data-en-placeholder', parts[0]);
            input.setAttribute('data-ar-placeholder', parts[1]);
            input.placeholder = document.body.classList.contains('en-mode') ? parts[0] : parts[1];
        }
    });
    
    // Load saved lang
    if (localStorage.getItem('preferred_lang') === 'en') {
        document.body.classList.add('en-mode');
        document.getElementById('langToggleBtn').innerText = 'عربي';
        updatePlaceholders();
    }
  });

  function updatePlaceholders() {
    const isEn = document.body.classList.contains('en-mode');
    const inputs = document.querySelectorAll('input[data-en-placeholder]');
    inputs.forEach(input => {
        input.placeholder = isEn ? input.getAttribute('data-en-placeholder') : input.getAttribute('data-ar-placeholder');
    });
  }

  function toggleLang() {
    document.body.classList.toggle('en-mode');
    const isEn = document.body.classList.contains('en-mode');
    document.getElementById('langToggleBtn').innerText = isEn ? 'عربي' : 'English';
    localStorage.setItem('preferred_lang', isEn ? 'en' : 'ar');
    updatePlaceholders();
  }
</script>
