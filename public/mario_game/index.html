<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة ماريو - المساعدين ضد المخربين 🍄</title>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    font-family: 'Changa', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ===== SCOREBOARD ===== */
  #scoreboard {
    width: 100%;
    display: flex;
    align-items: stretch;
    justify-content: center;
    height: 80px;
    background: #0d0d1a;
    box-shadow: 0 4px 30px rgba(0,0,0,0.8);
    position: relative;
    z-index: 100;
    flex-shrink: 0;
  }

  .score-team {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    flex: 1;
    padding: 0 25px;
    font-size: 30px;
    font-weight: 900;
    color: #fff;
  }

  .score-team.saboteurs {
    background: linear-gradient(135deg, #b91c1c, #e30a17, #ff0044);
    clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
    text-shadow: 0 0 20px rgba(255,0,68,0.8);
  }

  .score-team.helpers {
    background: linear-gradient(135deg, #1e3a8a, #1d4ed8, #3b82f6);
    clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%);
    text-shadow: 0 0 20px rgba(59,130,246,0.8);
  }

  .score-num {
    font-size: 46px;
    font-weight: 900;
    min-width: 55px;
    text-align: center;
    text-shadow: 0 0 30px currentColor;
  }

  .score-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0d0d1a;
    padding: 0 14px;
    z-index: 10;
  }

  .vs-text { font-size: 18px; font-weight: 900; color: #aaa; letter-spacing: 3px; }

  /* ===== PROGRESS BAR ===== */
  #progress-wrap {
    width: 100%;
    height: 22px;
    background: rgba(0,0,0,0.6);
    position: relative;
    flex-shrink: 0;
    overflow: hidden;
  }

  #progress-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 50%;
    background: linear-gradient(90deg, #3b82f6, #00f0ff);
    transition: width 0.3s ease;
  }

  #progress-mario {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 18px;
    transition: left 0.3s ease;
  }

  .progress-label-left {
    position: absolute;
    left: 8px; top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 900;
    color: #e30a17;
  }

  .progress-label-right {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 900;
    color: #3b82f6;
  }

  /* ===== STATUS BAR ===== */
  #status-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 15px;
    background: rgba(0,0,0,0.5);
    font-size: 13px;
    color: #aaa;
    height: 24px;
    flex-shrink: 0;
    z-index: 50;
  }

  /* ===== CANVAS ===== */
  #game-canvas {
    display: block;
    flex: 1;
    width: 100%;
    image-rendering: pixelated;
  }

  /* ===== EVENTS FEED ===== */
  #events-feed {
    position: fixed;
    bottom: 10px;
    right: 15px;
    display: flex;
    flex-direction: column-reverse;
    gap: 6px;
    z-index: 200;
    max-width: 280px;
    pointer-events: none;
  }

  .event-toast {
    background: rgba(0,0,0,0.85);
    border-radius: 10px;
    padding: 7px 13px;
    font-size: 14px;
    color: #fff;
    border-right: 4px solid #fff;
    animation: toastIn 0.3s ease, toastOut 0.5s ease 3.5s forwards;
    backdrop-filter: blur(5px);
  }
  .event-toast.saboteur { border-color: #e30a17; }
  .event-toast.helper   { border-color: #3b82f6; }
  .event-toast.neutral  { border-color: #ffd700; }

  @keyframes toastIn  { from { transform: translateX(80px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes toastOut { to   { opacity: 0; transform: translateX(30px); } }

  /* ===== FLASH ===== */
  #flash {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.15s;
  }

  /* ===== ANNOUNCE ===== */
  #announce {
    position: fixed;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 52px;
    font-weight: 900;
    color: #fff;
    pointer-events: none;
    z-index: 1000;
    opacity: 0;
    text-align: center;
    text-shadow: 0 0 40px currentColor;
    transition: opacity 0.3s;
    white-space: pre-line;
  }

  /* ===== JOIN BANNER ===== */
  #join-banner {
    position: fixed;
    top: 150px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    border: 2px solid #ffd700;
    border-radius: 16px;
    padding: 12px 28px;
    color: #ffd700;
    font-size: 19px;
    font-weight: 700;
    z-index: 500;
    text-align: center;
    backdrop-filter: blur(10px);
    pointer-events: none;
  }

  #test-badge {
    position: fixed;
    top: 155px; left: 15px;
    background: #00ff88;
    color: #000;
    font-weight: 900;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    z-index: 600;
    display: none;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- SCOREBOARD -->
<div id="scoreboard">
  <div class="score-team saboteurs">
    <span>المخربين</span>
    <span class="score-num" id="score-saboteurs">0</span>
  </div>
  <div class="score-center">
    <span class="vs-text">VS</span>
  </div>
  <div class="score-team helpers">
    <span class="score-num" id="score-helpers">0</span>
    <span>المساعدين</span>
  </div>
</div>

<!-- PROGRESS BAR -->
<div id="progress-wrap">
  <div id="progress-fill"></div>
  <span id="progress-mario">🍄</span>
  <span class="progress-label-left">⬅️ المخربين</span>
  <span class="progress-label-right">المساعدين ➡️</span>
</div>

<!-- STATUS BAR -->
<div id="status-bar">
  <span id="connection-status">⏳ جاري الاتصال...</span>
  <span id="teams-count">👥 المخربين: 0 | المساعدين: 0</span>
</div>

<!-- GAME CANVAS -->
<canvas id="game-canvas"></canvas>

<!-- EVENTS FEED -->
<div id="events-feed"></div>

<!-- FLASH -->
<div id="flash"></div>

<!-- ANNOUNCE -->
<div id="announce"></div>

<!-- JOIN BANNER -->
<div id="join-banner">اكتب <span style="color:#e30a17">مخرب</span> في الشات 💥 أو <span style="color:#3b82f6">مساعد</span> ⭐ للانضمام</div>

<!-- TEST BADGE -->
<div id="test-badge">🧪 وضع التجربة</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ============================================================
// CONFIG
// ============================================================
const WORLD_WIDTH   = 4000;   // total world width in px
const START_X       = 80;     // mario starts here (world coords)
const FINISH_X      = WORLD_WIDTH - 80;
const PUSH_FORWARD  = 100;    // helpers push mario forward (px)
const PUSH_BACK     = 80;     // enemies push mario backward (px)
const AUTO_SPEED    = 0;      // stopped automatic ground movement

// ============================================================
// CANVAS & CONTEXT
// ============================================================
const canvas = document.getElementById('game-canvas');
const ctx    = canvas.getContext('2d');

const urlParams  = new URLSearchParams(window.location.search);
const username   = urlParams.get('user') || localStorage.getItem('tiktokUsername');
const isTestMode = urlParams.get('test') === 'true';

if (isTestMode) document.getElementById('test-badge').style.display = 'block';

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight - 80 - 22 - 24; // minus scoreboard, progress, statusbar
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const GND = () => canvas.height - 80;

// ============================================================
// GAME STATE
// ============================================================
let scoreSaboteurs = 0;
let scoreHelpers   = 0;

// Mario world position (0 = start left, WORLD_WIDTH = finish right)
let marioWorldX = WORLD_WIDTH / 2;

// Camera: offset so mario is centered
let cameraX = 0;

// Teams
const userTeams    = {};
let saboteursCount = 0;
let helpersCount   = 0;

// Objects
let enemies   = [];
let coins     = [];
let stars     = [];
let particles = [];
let clouds    = [];

// Physics
let marioY      = 0;
let marioVY     = 0;
let marioOnGnd  = true;
let frame       = 0;
let gameRunning = true;
let roundPause  = false;

// ============================================================
// KEYBOARD INPUT
// ============================================================
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  // منع تحريك الصفحة بالأسهم
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function isLeft()   { return keys['ArrowLeft']  || keys['KeyA']; }
function isRight()  { return keys['ArrowRight'] || keys['KeyD']; }
function isJump()   { return keys['ArrowUp']    || keys['KeyW'] || keys['Space']; }
function isDown()   { return keys['ArrowDown']  || keys['KeyS']; }


// ============================================================
// INIT
// ============================================================
function init() {
  marioWorldX = WORLD_WIDTH / 2;
  marioY      = GND() - 58;
  marioVY     = 0;
  marioOnGnd  = true;
  enemies     = [];
  coins       = [];
  stars       = [];
  particles   = [];

  clouds = Array.from({length: 8}, (_, i) => ({
    wx: i * (WORLD_WIDTH / 7),
    y: 40 + Math.random() * 80,
    w: 100 + Math.random() * 80,
    speed: 0.3 + Math.random() * 0.2
  }));

  updateProgress();
}
init();

// ============================================================
// PROGRESS BAR
// ============================================================
function updateProgress() {
  const pct = (marioWorldX - START_X) / (FINISH_X - START_X);
  const clamped = Math.max(0, Math.min(1, pct));
  document.getElementById('progress-fill').style.width  = (clamped * 100) + '%';
  document.getElementById('progress-mario').style.left  = (clamped * 100) + '%';
}

// ============================================================
// SPAWN
// ============================================================
function spawnEnemy(count) {
  count = Math.min(count, 5);
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      // Enemies always spawn to the RIGHT of mario (coming towards him)
      enemies.push({
        wx: marioWorldX + 600 + i * 140,
        y: GND() - 44,
        w: 40, h: 44,
        type: Math.random() < 0.5 ? 'goomba' : 'spike',
        alive: true
      });
    }, i * 350);
  }
  flashScreen('rgba(227,10,23,0.25)');
  showAnnounce('💥 عدو قادم!', '#e30a17');
  showEvent(`المخربين أرسلوا ${count} عدو!`, 'saboteur');
}

function spawnCoins(count) {
  count = Math.min(count, 15);
  for (let i = 0; i < count; i++) {
    coins.push({
      wx: marioWorldX + 60 + i * 50 + Math.random() * 30,
      y: GND() - 30 - Math.random() * 80,
      r: 13, collected: false
    });
  }
  flashScreen('rgba(59,130,246,0.25)');
  showAnnounce('⭐ عملات!', '#3b82f6');
  showEvent(`مساعد أرسل ${count} عملة!`, 'helper');
}

function spawnStar() {
  stars.push({
    wx: marioWorldX + 80,
    y: GND() - 60,
    r: 22, alive: true
  });
  flashScreen('rgba(255,215,0,0.3)');
  showAnnounce('🌟 نجمة قوة!', '#ffd700');
  showEvent('نجمة قوة ظهرت!', 'neutral');
}

function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const spd   = 3 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 2,
      r: 4 + Math.random() * 5,
      life: 1,
      decay: 0.03 + Math.random() * 0.02,
      color
    });
  }
}

// ============================================================
// MARIO PUSH
// ============================================================
function pushMarioForward(px, reason) {
  if (roundPause) return;
  marioWorldX = Math.min(FINISH_X + 50, marioWorldX + px);
  spawnParticles(canvas.width * 0.5, marioY + 29, '#3b82f6', 10);
  updateProgress();
  checkWin();
}

function pushMarioBack(px, reason) {
  if (roundPause) return;
  marioWorldX = Math.max(START_X - 50, marioWorldX - px);
  spawnParticles(canvas.width * 0.5, marioY + 29, '#e30a17', 10);
  updateProgress();
  checkWin();
}

// ============================================================
// WIN CONDITION
// ============================================================
function checkWin() {
  if (roundPause) return;
  if (marioWorldX >= FINISH_X) {
    roundEnd('helpers');
  } else if (marioWorldX <= START_X) {
    roundEnd('saboteurs');
  }
}

function roundEnd(winner) {
  roundPause = true;
  if (winner === 'helpers') {
    scoreHelpers++;
    document.getElementById('score-helpers').textContent = scoreHelpers;
    flashScreen('rgba(59,130,246,0.5)');
    showAnnounce('🎉 المساعدين فازوا!\n+1 نقطة', '#3b82f6');
  } else {
    scoreSaboteurs++;
    document.getElementById('score-saboteurs').textContent = scoreSaboteurs;
    flashScreen('rgba(227,10,23,0.5)');
    showAnnounce('💥 المخربين فازوا!\n+1 نقطة', '#e30a17');
  }

  setTimeout(() => {
    init();
    roundPause = false;
    showAnnounce('▶️ جولة جديدة!', '#ffd700');
  }, 4000);
}

// ============================================================
// COLLISION
// ============================================================
function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// ============================================================
// GAME LOOP - UPDATE
// ============================================================
function update() {
  if (!gameRunning) return;
  frame++;
  const g = GND();

  if (roundPause) {
    // Camera follows mario even during pause
    cameraX = marioWorldX - canvas.width * 0.45;
    return;
  }

  // Mario movement: keyboard OR auto
  const KEYBOARD_SPEED = 5;
  if (isLeft())  marioWorldX -= KEYBOARD_SPEED;
  else if (isRight()) marioWorldX += KEYBOARD_SPEED;
  else marioWorldX += AUTO_SPEED;  // حركة تلقائية إذا لا يوجد ضغط
  marioWorldX = Math.max(START_X - 50, Math.min(FINISH_X + 50, marioWorldX));

  // Jump
  if (isJump() && marioOnGnd) {
    marioVY    = -14;
    marioOnGnd = false;
  }
  // Fast-fall (S / ArrowDown)
  if (isDown() && !marioOnGnd) {
    marioVY = Math.min(marioVY + 3, 20);
  }
  // Click-to-jump (canvas)
  // Camera follows mario
  cameraX = marioWorldX - canvas.width * 0.45;

  // Mario physics (gravity)
  marioVY += 0.65;
  marioY  += marioVY;
  if (marioY >= g - 58) {
    marioY     = g - 58;
    marioVY    = 0;
    marioOnGnd = true;
  } else {
    marioOnGnd = false;
  }

  // Check win after every movement
  checkWin();

  // Enemies move toward mario from the right
  enemies.forEach(en => {
    if (!en.alive) return;
    en.wx -= 4.0;  // always move left (toward mario who walks right)

    // Collision
    if (Math.abs(en.wx - marioWorldX) < 40 && Math.abs(en.y - marioY) < 55) {
      en.alive = false;
      pushMarioBack(PUSH_BACK, 'عدو');
      spawnParticles(marioWorldX - cameraX, marioY + 29, '#e30a17', 14);
      flashScreen('rgba(227,10,23,0.35)');
      showEvent('💥 عدو اصطدم بماريو!', 'saboteur');
    }
    // Remove if too far left (passed mario)
    if (en.wx < marioWorldX - 400) en.alive = false;
  });
  enemies = enemies.filter(e => e.alive);

  // Coins float toward mario slowly
  coins.forEach(c => {
    if (c.collected) return;
    // Move toward mario horizontally
    const dx = marioWorldX - c.wx;
    c.wx += dx * 0.04;
    // Collision
    if (Math.abs(c.wx - marioWorldX) < 40 && Math.abs(c.y - (marioY + 29)) < 55) {
      c.collected = true;
      pushMarioForward(PUSH_FORWARD, 'عملة');
      spawnParticles(c.wx - cameraX, c.y, '#ffd700', 8);
    }
    // Remove if too far
    if (c.wx < START_X - 300) c.collected = true;
  });
  coins = coins.filter(c => !c.collected);

  // Stars float toward mario
  stars.forEach(s => {
    if (!s.alive) return;
    const dx = marioWorldX - s.wx;
    s.wx += dx * 0.05;
    if (Math.abs(s.wx - marioWorldX) < 45 && Math.abs(s.y - (marioY + 29)) < 60) {
      s.alive = false;
      pushMarioForward(PUSH_FORWARD * 2, 'نجمة');
      spawnParticles(marioWorldX - cameraX, marioY + 29, '#ffd700', 20);
      showAnnounce('🚀 دفعة صاروخية!', '#ffd700');
    }
    if (s.wx < START_X - 300) s.alive = false;
  });
  stars = stars.filter(s => s.alive);

  // Particles
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= p.decay;
  });
  particles = particles.filter(p => p.life > 0);

  // Clouds
  clouds.forEach(c => {
    c.wx -= c.speed;
    if (c.wx + c.w < -200) c.wx = WORLD_WIDTH + 200;
  });
}

// ============================================================
// GAME LOOP - RENDER
// ============================================================
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const g = GND();

  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#050518');
  sky.addColorStop(0.65, '#12123a');
  sky.addColorStop(1, '#0a0a22');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Starfield (static)
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (let i = 0; i < 80; i++) {
    const sx = ((i * 137 + frame * 0.03) % canvas.width);
    const sy = (i * 61) % (canvas.height * 0.55);
    ctx.fillRect(sx, sy, i % 3 === 0 ? 2 : 1, i % 3 === 0 ? 2 : 1);
  }

  // Clouds
  clouds.forEach(c => {
    const cx = c.wx - cameraX;
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.beginPath();
    ctx.ellipse(cx, c.y, c.w / 2, 20, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - c.w * 0.2, c.y + 10, c.w * 0.35, 18, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + c.w * 0.2, c.y + 10, c.w * 0.3, 15, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  // START FLAG (red) - LEFT
  const startScreenX = START_X - cameraX;
  if (startScreenX > -30 && startScreenX < canvas.width + 30) {
    ctx.fillStyle = '#e30a17';
    ctx.fillRect(startScreenX - 3, g - 160, 6, 160);
    ctx.fillStyle = '#e30a17';
    ctx.beginPath();
    ctx.moveTo(startScreenX + 3, g - 160);
    ctx.lineTo(startScreenX + 50, g - 140);
    ctx.lineTo(startScreenX + 3, g - 120);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Changa';
    ctx.fillText('البداية', startScreenX - 25, g - 175);
  }

  // FINISH FLAG (blue) - RIGHT
  const finishScreenX = FINISH_X - cameraX;
  if (finishScreenX > -30 && finishScreenX < canvas.width + 30) {
    ctx.fillStyle = '#3b82f6';
    ctx.fillRect(finishScreenX - 3, g - 160, 6, 160);
    ctx.beginPath();
    ctx.moveTo(finishScreenX + 3, g - 160);
    ctx.lineTo(finishScreenX + 50, g - 140);
    ctx.lineTo(finishScreenX + 3, g - 120);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Changa';
    ctx.fillText('النهاية', finishScreenX - 20, g - 175);
  }

  // GROUND
  const gGrad = ctx.createLinearGradient(0, g, 0, canvas.height);
  gGrad.addColorStop(0, '#2d4a1e');
  gGrad.addColorStop(0.15, '#1a2e10');
  gGrad.addColorStop(1, '#0d1a08');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, g, canvas.width, canvas.height - g);
  ctx.fillStyle = '#4a8c2e';
  ctx.fillRect(0, g, canvas.width, 12);

  // Ground glow
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#4a8c2e';
  ctx.strokeStyle = '#6abf45';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, g);
  ctx.lineTo(canvas.width, g);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Ground tiles
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  const tileStart = Math.floor(cameraX / 40) * 40;
  for (let tx = tileStart; tx < cameraX + canvas.width + 40; tx += 40) {
    ctx.strokeRect(tx - cameraX, g + 12, 40, 30);
  }

  // PARTICLES
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // COINS
  coins.forEach(c => {
    if (c.collected) return;
    const cx = c.wx - cameraX;
    const pulse = 1 + Math.sin(frame * 0.12 + c.wx * 0.01) * 0.1;
    ctx.shadowBlur = 12; ctx.shadowColor = '#ffd700';
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(cx, c.y, c.r * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffec6e';
    ctx.beginPath();
    ctx.arc(cx - 3, c.y - 3, c.r * 0.4 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // STARS
  stars.forEach(s => {
    if (!s.alive) return;
    const sx = s.wx - cameraX;
    ctx.save();
    ctx.shadowBlur = 25; ctx.shadowColor = '#ffd700';
    ctx.fillStyle = '#ffd700';
    ctx.translate(sx, s.y);
    ctx.rotate(frame * 0.06);
    const pts = 5;
    ctx.beginPath();
    for (let i = 0; i < pts * 2; i++) {
      const angle = (i * Math.PI) / pts;
      const r = i % 2 === 0 ? s.r : s.r * 0.45;
      ctx.lineTo(Math.cos(angle - Math.PI / 2) * r, Math.sin(angle - Math.PI / 2) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // ENEMIES
  enemies.forEach(en => {
    if (!en.alive) return;
    const ex = en.wx - cameraX;
    const { y, w, h, type } = en;

    ctx.shadowBlur = 0;
    if (type === 'goomba') {
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(ex, y + 10, w, h - 10);
      ctx.fillStyle = '#A0522D';
      ctx.beginPath();
      ctx.arc(ex + w / 2, y + 10, w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(ex + 6, y + 5, 9, 8);
      ctx.fillRect(ex + w - 15, y + 5, 9, 8);
      ctx.fillStyle = '#e30a17';
      ctx.fillRect(ex + 8, y + 7, 5, 5);
      ctx.fillRect(ex + w - 13, y + 7, 5, 5);
      ctx.fillStyle = '#3a1a00';
      ctx.fillRect(ex + 5, y + 3, 11, 4);
      ctx.fillRect(ex + w - 16, y + 3, 11, 4);
      const lOff = Math.sin(frame * 0.2) * 5;
      ctx.fillStyle = '#5c2a00';
      ctx.fillRect(ex + 5,     y + h - 4, 12, 12 + lOff);
      ctx.fillRect(ex + w - 17, y + h - 4, 12, 12 - lOff);
    } else {
      ctx.fillStyle = '#5a0a80';
      ctx.fillRect(ex + 4, y + 14, w - 8, h - 14);
      ctx.beginPath();
      ctx.arc(ex + w / 2, y + 14, (w - 8) / 2, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#ff0080';
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(ex + 4 + i * 8, y + 14);
        ctx.lineTo(ex + 8 + i * 8, y);
        ctx.lineTo(ex + 12 + i * 8, y + 14);
        ctx.fill();
      }
      ctx.fillStyle = '#ff0080';
      ctx.fillRect(ex + 8,      y + 16, 8, 8);
      ctx.fillRect(ex + w - 16, y + 16, 8, 8);
      ctx.fillStyle = '#fff';
      ctx.fillRect(ex + 10,     y + 18, 4, 4);
      ctx.fillRect(ex + w - 14, y + 18, 4, 4);
    }

    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(ex + w / 2, g + 4, w / 2, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  // MARIO (always drawn at screen center-ish)
  const mx = marioWorldX - cameraX;
  const my = marioY;
  const mw = 42, mh = 58;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(mx + mw / 2, g + 4, mw / 2, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.fillStyle = '#e30a17';
  ctx.fillRect(mx + 4, my + 22, mw - 8, mh - 22);
  // Overalls
  ctx.fillStyle = '#1d4ed8';
  ctx.fillRect(mx + 4, my + 30, mw - 8, 14);
  // Hat
  ctx.fillStyle = '#e30a17';
  ctx.fillRect(mx + 3,  my + 6,  mw - 6, 14);
  ctx.fillRect(mx,      my + 12, mw,     8);
  // Face
  ctx.fillStyle = '#ffcc99';
  ctx.fillRect(mx + 8, my + 18, mw - 16, 16);
  // Eyes
  ctx.fillStyle = '#000';
  ctx.fillRect(mx + 12, my + 20, 5, 5);
  ctx.fillRect(mx + 24, my + 20, 5, 5);
  // Mustache
  ctx.fillStyle = '#4a2c0a';
  ctx.fillRect(mx + 10, my + 28, 22, 4);
  ctx.fillRect(mx + 8,  my + 26, 10, 3);
  ctx.fillRect(mx + 24, my + 26, 10, 3);
  // Legs
  const legOff = marioOnGnd ? Math.sin(frame * 0.22) * 7 : 0;
  ctx.fillStyle = '#e30a17';
  ctx.fillRect(mx + 5,      my + mh - 18, 12, 18 + legOff);
  ctx.fillRect(mx + mw - 17, my + mh - 18, 12, 18 - legOff);
  // Shoes
  ctx.fillStyle = '#1a0800';
  ctx.fillRect(mx + 2,      my + mh,      16, 8);
  ctx.fillRect(mx + mw - 18, my + mh,     16, 8);

  // ── Keyboard Hint HUD (bottom-left) ──
  drawKeyHints();
}

function drawKeyHints() {
  const bx = 14, by = canvas.height - 110;
  const ks = 32, gap = 4;
  const keyColor    = 'rgba(255,255,255,0.12)';
  const keyBorder   = 'rgba(255,255,255,0.35)';
  const keyActive   = 'rgba(255,215,0,0.55)';
  const textColor   = '#ffffff';

  function drawKey(x, y, label, active) {
    ctx.fillStyle   = active ? keyActive : keyColor;
    ctx.strokeStyle = keyBorder;
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.roundRect(x, y, ks, ks, 6);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle  = textColor;
    ctx.font       = 'bold 12px monospace';
    ctx.textAlign  = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x + ks / 2, y + ks / 2);
  }

  // W / ↑  (top-center)
  drawKey(bx + ks + gap, by,            '↑/W',  isJump());
  // A / ←  S / ↓  D / →
  drawKey(bx,            by + ks + gap, '←/A',  isLeft());
  drawKey(bx + ks + gap, by + ks + gap, '↓/S',  isDown());
  drawKey(bx + (ks+gap)*2, by + ks + gap, '→/D', isRight());
}


// ============================================================
// MAIN LOOP
// ============================================================
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();

// ============================================================
// CLICK / TAP TO JUMP
// ============================================================
canvas.addEventListener('click', () => {
  if (marioOnGnd && !roundPause) {
    marioVY    = -14;
    marioOnGnd = false;
  }
});

// ============================================================
// UI HELPERS
// ============================================================
let announceTimer = null;
function showAnnounce(msg, color) {
  const el = document.getElementById('announce');
  el.textContent    = msg;
  el.style.color    = color;
  el.style.textShadow = `0 0 40px ${color}`;
  el.style.opacity  = '1';
  clearTimeout(announceTimer);
  announceTimer = setTimeout(() => el.style.opacity = '0', 2500);
}

function flashScreen(color) {
  const f = document.getElementById('flash');
  f.style.background = color;
  f.style.opacity    = '1';
  setTimeout(() => f.style.opacity = '0', 200);
}

function showEvent(msg, type) {
  const feed = document.getElementById('events-feed');
  const el   = document.createElement('div');
  el.className  = `event-toast ${type}`;
  el.textContent = msg;
  feed.appendChild(el);
  setTimeout(() => el.remove(), 4200);
  // keep max 5
  const toasts = feed.querySelectorAll('.event-toast');
  if (toasts.length > 5) toasts[0].remove();
}

function updateTeamsCount() {
  document.getElementById('teams-count').textContent =
    `👥 المخربين: ${saboteursCount} | المساعدين: ${helpersCount}`;
}

// ============================================================
// SOCKET.IO - TIKTOK EVENTS
// ============================================================
const socket   = io();
const statusEl = document.getElementById('connection-status');

if (isTestMode) {
  statusEl.textContent = '🟢 وضع التجربة';
  statusEl.style.color = '#00ff88';

  // Simulate random events every few seconds
  setInterval(() => {
    if (roundPause) return;
    const r = Math.random();
    if (r < 0.35) {
      spawnEnemy(Math.random() < 0.3 ? 2 : 1);
    } else if (r < 0.65) {
      spawnCoins(Math.floor(Math.random() * 5) + 3);
    } else if (r < 0.8) {
      spawnStar();
    }
  }, 3000);

  setInterval(() => {
    saboteursCount = Math.floor(Math.random() * 15) + 2;
    helpersCount   = Math.floor(Math.random() * 20) + 3;
    updateTeamsCount();
  }, 4000);

} else if (username) {
  socket.emit('connectTikTok', username);
}

socket.on('tiktokConnected', () => {
  statusEl.textContent = '🟢 متصل بـ @' + username;
  statusEl.style.color = '#00ff88';
  setTimeout(() => statusEl.style.opacity = '0.6', 5000);
});

socket.on('tiktokError', msg => {
  statusEl.textContent = '🔴 ' + (msg || 'خطأ بالاتصال');
  statusEl.style.color = '#e30a17';
});

// CHAT - join team
socket.on('tiktokChat', data => {
  const comment = (data.comment || '').trim();
  const uid     = data.uniqueId;

  if (comment.includes('مخرب') || comment.includes('مخربين')) {
    const wasNew = !userTeams[uid] || userTeams[uid] !== 'saboteur';
    userTeams[uid] = 'saboteur';
    if (wasNew) {
      saboteursCount++;
      updateTeamsCount();
      showEvent(`${data.nickname} انضم للمخربين! 💥`, 'saboteur');
      spawnEnemy(1);
    }
  } else if (comment.includes('مساعد') || comment.includes('مساعدين')) {
    const wasNew = !userTeams[uid] || userTeams[uid] !== 'helper';
    userTeams[uid] = 'helper';
    if (wasNew) {
      helpersCount++;
      updateTeamsCount();
      showEvent(`${data.nickname} انضم للمساعدين! ⭐`, 'helper');
      spawnCoins(3);
    }
  }
});

// GIFT - trigger events based on team
socket.on('tiktokGift', data => {
  if (!data.repeatEnd) return;
  if (roundPause) return;
  const uid      = data.uniqueId;
  const team     = userTeams[uid];
  const diamonds = (data.diamondCount || 1) * (data.repeatCount || 1);
  const count    = Math.max(1, Math.floor(diamonds / 10));

  if (team === 'saboteur') {
    spawnEnemy(Math.min(count, 4));
    showEvent(`${data.nickname} أرسل عدو! 💥`, 'saboteur');
  } else if (team === 'helper') {
    if (diamonds >= 100) {
      spawnStar();
    } else {
      spawnCoins(Math.min(count * 3, 12));
    }
    showEvent(`${data.nickname} أرسل مساعدة! ⭐`, 'helper');
  } else {
    // No team - random
    if (Math.random() < 0.5) spawnCoins(3);
    else spawnEnemy(1);
  }
});

// LIKE - small helper boost (random)
socket.on('tiktokLike', data => {
  if (roundPause) return;
  if (userTeams[data.uniqueId] === 'helper' && Math.random() < 0.15) {
    spawnCoins(2);
  }
});

// FOLLOW - bonus coins
socket.on('tiktokFollow', data => {
  if (roundPause) return;
  spawnCoins(5);
  showEvent(`${data.nickname} تابع! +5 عملات ⭐`, 'helper');
});

// SHARE - saboteur bonus
socket.on('tiktokShare', data => {
  if (roundPause) return;
  if (userTeams[data.uniqueId] === 'saboteur') {
    spawnEnemy(2);
    showEvent(`${data.nickname} شارك! عدو مزدوج! 💥`, 'saboteur');
  }
});

// SUBSCRIBE - big star
socket.on('tiktokSubscribe', data => {
  if (roundPause) return;
  spawnStar();
  showEvent(`${data.nickname} اشترك! نجمة قوة! 🌟`, 'neutral');
});
</script>
